name: kattens-vaern

services:

  db:
    image: postgres:16
    container_name: kattens-vaern-db
    shm_size: 128mb

    volumes:
      - psql_data:/var/lib/postgresql/data
      - ./sqlDB:/docker-entrypoint-initdb.d

    ports:
      - "5433:5432"

    environment:
      POSTGRES_USER: cat123
      POSTGRES_PASSWORD: cat1234
      POSTGRES_DB: kattensvaern

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cat123 -d kattensvaern"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    container_name: kattens-vaern-adminer
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  psql_data:

